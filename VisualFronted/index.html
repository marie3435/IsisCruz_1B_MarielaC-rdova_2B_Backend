<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">
    <main class="container py-5">
        <section>
            <h1 class="text-center mb-5"></h1>
            <p class="text-muted"></p>
        </section>

        <section class="card-body">
            <!-- Formulario -->
             <form id="formCliente">
                <!-- Registrar ID del registro -->
                 <input type="hidden" id="idCliente">
                 <div class="form-group my-3">
                    <label for="txtName" class="form-label">Nombre</label>
                    <input type="name" id="txtName" class="form-control" requi>
                 </div>
                      <div  class="form-group my-3">
                        <label for="txtPrice" class="form-label"> Apellido</label>
                        <input type="price" id="txtPrice" class="form-control" required>
                    </div>
                    
                    <div  class="form-group my-3">
                        <label for="txtStock" class="form-label"> Telefono</label>
                        <input type="stock" id="txtStock" class="form-control" required>
                    </div>

                    <div  class="form-group my-3">
                         <label for="opciones">Categorias:</label>
                         <select id="opciones" name="opciones">
                            <option value="Clientes">Cliente</option>
                            <option value="Salones">Salones</option>
                            <option value="Eventos">Eventos </option>
                        </select>
                        <input type="cate">
                    </div>

                    <button type="submit" id= "btnGuardar" class="btn btn-primary">Guardar Registro</button>
                    <button id="btnCancelar" class="btn btn-warning d-none" type="button">Cancelar</button>
             </form>
        </section>

         <section class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h2 class="h5 mb-0">Inventario</h2>
            </div>

            <div class="card-body">

                <div id="mensaje" class="alert d-none" role="alert"></div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Categoria</th>
                            </tr>
                        </thead>
                        <tbody id="tablacliente">
                         
                        </tbody>
                    </table>
                </div>
                
            </div>
        </section>

    </main>




<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- INDEX CONTROLLER -->
<script type="module" src="js/controllers/indexcontrollers.js"></script>

</body>
</html>
